# Source Specification B: Hydraulic Rock Breaker (Montabert SC-36)
# SEDF-structured specification for Level 3 synthesis engine

metadata:
  system_name: "Hydraulic Rock Breaker"
  model: "Montabert SC-36"
  classification: "Industrial tool"
  function: "Rock fracturing via percussion"
  description: "Hydraulic-powered impact hammer for construction and mining applications"

L0_governing_concept:
  description: "Continuous hydraulic cycling to generate high-frequency percussion impacts for rock fracturing"
  primary_function: "Rock breaking via repeated impact energy transfer"
  energy_source: "Hydraulic fluid under pressure from external pump"
  operating_principle: "Self-oscillating hydraulic circuit with accumulator assist"
  environment: "Ambient air with sealed hydraulic system"

L1_functional_architecture:
  energy_flow_sequence:
    - step: "Hydraulic charging"
      description: "Pressurized fluid fills accumulator and chambers"
      energy_form: "Hydraulic pressure potential"
    - step: "Valve switching"
      description: "Pilot valve redirects flow to drive chamber"
      energy_form: "Flow control signal"
    - step: "Piston acceleration"
      description: "Hydraulic pressure accelerates piston downward"
      energy_form: "Hydraulic to kinetic"
    - step: "Impact delivery"
      description: "Piston strikes tool transferring momentum"
      energy_form: "Kinetic to impact"
    - step: "Return stroke"
      description: "Return chamber pressure pulls piston back"
      energy_form: "Hydraulic pressure recovery"
    - step: "Cycle reset"
      description: "Valve switches to restart sequence"
      energy_form: "System state reset"
  rate_limiter: "Valve switching frequency and hydraulic refill time"
  cycle_frequency: "25 Hz typical operation"

L2_domain_primitives:
  A_energy_source:
    code: "A2 + A3"
    description: "Hydraulic primary (A2) with pneumatic accumulator assist (A3)"
    justification: "Hydraulic pump provides continuous power, accumulator smooths flow pulses"
  B_energy_release:
    code: "B1"
    description: "Continuous cycle"
    justification: "Self-oscillating valve system maintains continuous 25 Hz operation"
  C_kinematic_constraint:
    code: "C1"
    description: "Linear guide"
    justification: "Piston constrained to single-axis translation by cylinder bore"
  D_force_delivery:
    code: "D1"
    description: "Percussion"
    justification: "Energy delivered via direct solid-to-solid impact"
  E_sealing_containment:
    code: "E2"
    description: "Dynamic seal"
    justification: "Sealed hydraulic circuit with dynamic seals on moving piston"
  F_control_interface:
    code: "F1"
    description: "Mechanical pilot"
    justification: "Pressure-driven pilot valve controls main flow switching"

L3_mechanisms:
  self_oscillating_valve:
    implements: "B1"
    description: "Hydraulic pilot valve with automatic switching based on piston position"
    function: "Control flow direction to maintain continuous cycling"
    switching_principle: "Pressure differential triggers valve position change"
    switching_frequency: "25 Hz"
    response_time: "2-5 ms"
  
  pneumatic_accumulator:
    implements: "A3"
    description: "Gas-charged hydraulic accumulator for energy storage and flow smoothing"
    function: "Store hydraulic energy and provide peak flow during impact"
    gas_type: "Nitrogen pre-charge"
    volume: "1.5 L"
    pressure_range: "50-210 bar"
  
  linear_hydraulic_cylinder:
    implements: "C1"
    description: "Double-acting hydraulic cylinder with precision bore"
    function: "Convert hydraulic pressure to linear piston motion"
    bore_diameter: "80 mm"
    stroke_length: "85 mm"
    operating_pressure: "210 bar max"
  
  impact_mechanism:
    implements: "D1"
    description: "Hardened steel piston impacts tool shank for energy transfer"
    function: "Convert kinetic energy to impact loading of target"
    piston_mass: "20 kg"
    impact_velocity: "4-6 m/s typical"
    tool_interface: "Hexagonal shank socket"

